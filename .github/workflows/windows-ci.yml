# Windows CI: lint, test and build the installer on every push and pull request.
# A push to main whose Cargo.toml version has no release yet publishes one: the
# vX.Y.Z tag and release are created here, so nobody has to push tags.
name: Windows

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # GPL build: includes libx264/libx265, which smart cut needs. VibePlayer is GPL-3.0 too.
  FFMPEG_BUILD: ffmpeg-n8.1-latest-win64-gpl-shared-8.1
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell whether this version was already released.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_BUILD.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP $env:FFMPEG_BUILD
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Decoding, export and smart cut tests
        run: cargo test -p media -p export -- --ignored

      - name: Release build
        run: cargo build --release

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\vibeplayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: VibePlayer-installer
          path: target/installer/*.exe

      - name: Decide on a release
        id: release
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $tag = "v" + $match.Matches[0].Groups[1].Value
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like "refs/tags/*") {
            # A pushed tag must match the version the installer was built with.
            if ($env:GITHUB_REF_NAME -ne $tag) {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $tag"
              exit 1
            }
            "publish=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $existing = git tag --list $tag
            if ($existing) {
              Write-Output "$tag is already released; nothing to publish."
              "publish=false" >> $env:GITHUB_OUTPUT
            } else {
              Write-Output "Publishing $tag."
              "publish=true" >> $env:GITHUB_OUTPUT
            }
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VibePlayer ${{ steps.release.outputs.tag }}
          files: target/installer/*.exe
          generate_release_notes: true
