[package]
name = "app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "vibeplayer"
path = "src/main.rs"

[dependencies]
audio.workspace = true
crossbeam.workspace = true
cut.workspace = true
eframe.workspace = true
export.workspace = true
library.workspace = true
media.workspace = true
playback.workspace = true
render.workspace = true
thumbnails.workspace = true
update.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Media",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# winit needs a windowing backend to build on Linux dev machines; Windows needs none.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11"] }

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
